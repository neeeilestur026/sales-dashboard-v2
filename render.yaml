services:
  - type: web
    name: hi-escorp-portal
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # A300: one process (the tools keep per-user state in process memory, and two sync workers split a
    # user's requests between two processes that could not see each other). A357: eight threads, not four —
    # nearly every request waits on Apps Script or the mailbox, and the director's dashboard opens a dozen at once.
    startCommand: gunicorn app:app --workers 1 --threads 8 --worker-class gthread --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PO_GOOGLE_APPS_SCRIPT_URL
        sync: false
      - key: PR_GOOGLE_APPS_SCRIPT_URL
        sync: false
      - key: MRO_GOOGLE_APPS_SCRIPT_URL
        sync: false
      - key: QUOTATION_GOOGLE_APPS_SCRIPT_URL
        sync: false
      - key: MI_GOOGLE_APPS_SCRIPT_URL
        sync: false
      - key: INVENTORY_SHEET_ID
        sync: false
      - key: MRO_SHEET_ID
        sync: false
      - key: MI_SHEET_ID
        sync: false
      - key: DASHBOARD_APPS_SCRIPT_URL
        sync: false
      - key: FLOW_APPS_SCRIPT_URL
        sync: false
      - key: PAYMENT_REQUEST_APPS_SCRIPT_URL
        sync: false
      - key: EMAIL_CRED_KEY
        sync: false
      - key: INTERNAL_SHARED_SECRET
        sync: false
      - key: GODADDY_IMAP_HOST
        value: imap.secureserver.net
