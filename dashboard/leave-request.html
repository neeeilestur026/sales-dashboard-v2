<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Dashboard — Leave Request</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/training-mode.css">
</head>
<body>
  <script src="js/theme.js"></script>
  <header class="navbar" id="navbar"></header>

  <main class="main-content">
    <div class="leave-container">
      <div class="page-header">
        <div>
          <h1>Leave request</h1>
          <p>Submit a leave request for approval.</p>
        </div>
      </div>

      <div class="section-card">
        <div class="section-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          New leave request
        </div>
        <form id="leaveForm" onsubmit="submitLeave(event)">
          <div class="leave-form">
            <div class="form-group">
              <label class="form-label" for="leaveEmployee">Employee name</label>
              <input type="text" id="leaveEmployee" class="form-input" readonly>
            </div>
            <div class="form-group">
              <label class="form-label" for="leaveType">Leave type <span class="req">*</span></label>
              <select id="leaveType" class="form-input" required>
                <option value="Vacation">Vacation</option>
                <option value="Sick">Sick</option>
                <option value="Personal">Personal</option>
                <option value="Half Day">Half Day</option>
                <option value="Undertime">Undertime</option>
                <option value="Maternity/Paternity">Maternity/Paternity</option>
                <option value="Emergency">Emergency</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="leaveStart">Start date <span class="req">*</span></label>
              <input type="date" id="leaveStart" class="form-input" required onchange="calcDays()">
            </div>
            <div class="form-group">
              <label class="form-label" for="leaveEnd">End date <span class="req">*</span></label>
              <input type="date" id="leaveEnd" class="form-input" required onchange="calcDays()">
            </div>
            <div class="form-group">
              <label class="form-label" for="leaveDays">Days</label>
              <input type="number" id="leaveDays" class="form-input" min="0.5" step="0.5" readonly>
            </div>
            <div class="form-group full">
              <label class="form-label" for="leaveReason">Reason</label>
              <textarea id="leaveReason" class="form-input" placeholder="Reason for leave"></textarea>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-lg btn-block btn-submit" id="submitBtn">Submit leave request</button>
          <div id="formMsg" class="form-msg"></div>
        </form>
      </div>

      <div class="section-card">
        <div class="section-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          My leave history
        </div>
        <div id="leaveContainer" class="table-wrapper">
          <div class="loading-overlay"><div class="spinner spinner-lg"></div><span>Loading...</span></div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/leave-request.js"></script>
  <script src="js/training-mode.js"></script>
</body>
</html>
