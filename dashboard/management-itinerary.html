<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow — Weekly Itineraries</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/flow.css">
  <link rel="stylesheet" href="css/flow-screen.css">
<style>
  /* A216 — the rail is the queue AND the team roster; the pane is one rep's whole week.
     Splitting them this way is what lets one page both approve and monitor: you never lose sight of
     who else is out there while reading one person's plan. */
  .mi-wrap { display: grid; grid-template-columns: 258px minmax(0, 1fr); gap: 1rem; align-items: start; }
  .mi-wrap > * { min-width: 0; }
  @media (max-width: 1000px) { .mi-wrap { grid-template-columns: minmax(0, 1fr); } }

  .mi-rail { background: var(--hx-card); border: 1px solid var(--hx-hair); border-radius: 18px;
             padding: .4rem; position: sticky; top: 96px; max-height: calc(100vh - 120px); overflow-y: auto; }
  @media (max-width: 1000px) { .mi-rail { position: static; max-height: none; } }
  .mi-railhead { font: 700 10.5px 'Inter', sans-serif; letter-spacing: .05em; text-transform: uppercase;
                 color: var(--hx-ink-3); padding: .55rem .6rem .35rem; }

  .mi-who { display: block; width: 100%; text-align: left; border: 0; background: none; cursor: pointer;
            padding: .55rem .6rem; border-radius: 12px; font-family: 'Inter', sans-serif; }
  .mi-who:hover { background: var(--hx-inset); }
  .mi-who.on { background: var(--hx-navy-soft); box-shadow: inset 0 0 0 1px var(--hx-navy-line); }
  .mi-who .n { display: flex; align-items: center; gap: .35rem; font-weight: 700; font-size: .82rem;
               color: var(--hx-ink); }
  .mi-who .n .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .mi-who .s { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
               margin-top: .12rem; }
  .mi-who .c { font-size: .72rem; color: var(--hx-ink-3); margin-top: .16rem;
               font-variant-numeric: tabular-nums; }

  /* One colour per bucket, used on the rail dot, the rail label and the pane's status chip, so the
     same state never looks like two different things on one screen. */
  .b-needs-you { color: var(--hx-warn); } .d-needs-you { background: var(--hx-warn); }
  .b-no-plan   { color: var(--hx-red); } .d-no-plan   { background: var(--hx-red); }
  .b-pending   { color: var(--hx-navy-text); } .d-pending   { background: var(--hx-navy); }
  .b-draft     { color: var(--hx-ink-3); } .d-draft     { background: var(--hx-ink-3); }
  .b-rejected  { color: var(--hx-red); } .d-rejected  { background: var(--hx-red); }
  .b-approved  { color: var(--hx-ok); } .d-approved  { background: var(--hx-ok); }
  .b-idle      { color: var(--hx-ink-3); } .d-idle      { background: var(--hx-hair); }

  .mi-pane { background: var(--hx-card); border: 1px solid var(--hx-hair); border-radius: 18px;
             padding: 1.1rem 1.2rem; }
  .mi-panehead { display: flex; align-items: flex-start; gap: .8rem; flex-wrap: wrap;
                 border-bottom: 1px solid var(--hx-hair); padding-bottom: .8rem; margin-bottom: .9rem; }
  .mi-panehead h2 { margin: 0; font-size: 1.08rem; font-weight: 800; }
  .mi-panehead .acts { margin-left: auto; display: flex; gap: .4rem; }
  .mi-chip { display: inline-block; padding: .12rem .5rem; border-radius: 999px; font: 700 .68rem 'Inter', sans-serif;
             text-transform: uppercase; letter-spacing: .03em; background: var(--hx-inset); }
  .mi-note { font-size: .78rem; color: var(--hx-ink-2); line-height: 1.6; margin-top: .3rem; }
  .mi-note b { color: var(--hx-ink); }

  .mi-banner { padding: .6rem .8rem; border-radius: 11px; font-size: .8rem; line-height: 1.6;
               border-left: 3px solid; margin-bottom: .9rem; }
  .mi-banner.warn { background: var(--hx-warn-soft); border-color: var(--hx-warn); color: var(--hx-warn); }
  .mi-banner.bad  { background: var(--hx-red-soft); border-color: var(--hx-red); color: var(--hx-red); }
  .mi-banner.good { background: var(--hx-ok-soft); border-color: var(--hx-ok); color: var(--hx-ok); }
  .mi-banner.info { background: var(--hx-inset); border-color: var(--hx-ink-3); color: var(--hx-ink-2); }

  .mi-day { border: 1px solid var(--hx-hair); border-radius: 13px; margin-bottom: .7rem; overflow: hidden; }
  .mi-day.quiet { opacity: .62; }
  .mi-dayhead { display: flex; align-items: center; gap: .55rem; padding: .5rem .7rem;
                background: var(--hx-inset); border-bottom: 1px solid var(--hx-hair); }
  .mi-dayhead .d { font: 800 .82rem 'Inter', sans-serif; }
  .mi-dayhead .dt { font-size: .74rem; color: var(--hx-ink-3); }
  .mi-dayhead .n { margin-left: auto; font-size: .72rem; color: var(--hx-ink-3);
                   font-variant-numeric: tabular-nums; }
  .mi-sect { font: 700 .66rem 'Inter', sans-serif; text-transform: uppercase; letter-spacing: .05em;
             color: var(--hx-ink-3); padding: .5rem .7rem .25rem; }
  .mi-table { width: 100%; border-collapse: collapse; font-size: .76rem; }
  .mi-table th { text-align: left; font: 700 .66rem 'Inter', sans-serif; text-transform: uppercase;
                 letter-spacing: .03em; color: var(--hx-ink-3); padding: .3rem .55rem; border-bottom: 1px solid var(--hx-hair); }
  .mi-table td { padding: .38rem .55rem; border-bottom: 1px solid var(--hx-inset); vertical-align: top;
                 color: var(--hx-ink-2); }
  .mi-table tr:last-child td { border-bottom: 0; }
  .mi-table td.k { color: var(--hx-ink); font-weight: 600; }
  .mi-empty { padding: .45rem .7rem .6rem; font-size: .76rem; color: var(--hx-ink-3); font-style: italic; }

  /* The three match kinds must never look alike — a guess that reads like a fact is the one thing
     this page cannot afford. */
  .mi-tag { display: inline-block; padding: .05rem .4rem; border-radius: 999px; white-space: nowrap;
            font: 700 .64rem 'Inter', sans-serif; }
  .mi-tag.exact  { background: var(--hx-ok-soft); color: var(--hx-ok); }
  .mi-tag.likely { background: var(--hx-inset); color: var(--hx-ink-2); font-style: italic; font-weight: 600; }
  .mi-tag.miss   { background: var(--hx-warn-soft); color: var(--hx-warn); }
  .mi-tag.unpl   { background: var(--hx-inset); color: var(--hx-ink-3); }
  .mi-tag.dang   { background: var(--hx-red-soft); color: var(--hx-red); }

  .mi-photo { height: 40px; border-radius: 6px; border: 1px solid var(--hx-hair); cursor: zoom-in; }

  .weeknav { display: flex; gap: 6px; align-items: center; }
  .weeknav .rng { font: 700 .82rem 'Inter', sans-serif; min-width: 172px; text-align: center;
                  font-variant-numeric: tabular-nums; }

  @media print {
    .navbar, .no-print, .mi-rail, .weeknav { display: none !important; }
    body { background: var(--hx-card); }
    .main-content { padding: 0 !important; margin: 0 !important; }
    .mi-wrap { grid-template-columns: minmax(0, 1fr) !important; }
    .mi-pane { border: none; box-shadow: none; padding: 0; }
    .mi-day { break-inside: avoid; }
  }
</style>
</head>
<body class="flow-screen">
  <script src="js/theme.js"></script>
  <header class="navbar" id="navbar"></header>
  <main class="main-content">
    <div class="hband">
      <div class="left">
        <div class="dpill"><span class="d" id="hbDay">—</span><span class="m" id="hbMon">&nbsp;</span></div>
        <div>
          <div class="eyebrow">Sales · Field Plans</div>
          <h1>Weekly Itineraries</h1>
          <p>Approve the week's plans, then see how the week actually went against them.</p>
        </div>
      </div>
      <div class="no-print" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <div class="weeknav">
          <button class="btn btn-sm btn-secondary" id="miPrev" title="Previous week">◀</button>
          <span class="rng" id="miRange">—</span>
          <button class="btn btn-sm btn-secondary" id="miNext" title="Next week">▶</button>
        </div>
        <button class="btn btn-sm btn-secondary" id="miThis">This week</button>
        <button class="btn btn-sm btn-secondary" id="miRefresh">Refresh</button>
        <button class="btn btn-sm btn-secondary" id="miPrint">Print</button>
      </div>
    </div>

    <div id="miMsg" class="flow-msg" style="display:none;"></div>
    <div id="miAlert"></div>
    <div id="miKpis" class="kpi-row five"></div>

    <div class="mi-wrap">
      <aside class="mi-rail no-print">
        <div class="mi-railhead">The team this week</div>
        <div id="miRail"></div>
      </aside>
      <section class="mi-pane" id="miPane">
        <div class="loading-overlay"><div class="spinner spinner-lg"></div><span>Loading...</span></div>
      </section>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/flow-api.js"></script>
  <script src="js/itinerary-week.js"></script>
  <script src="js/management-itinerary.js"></script>
  <script>
    (function () {
      var d = new Date(), D = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],
          M = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      var dd = document.getElementById('hbDay'), mm = document.getElementById('hbMon');
      if (dd) dd.textContent = String(d.getDate()).padStart(2, '0');
      if (mm) mm.innerHTML = D[d.getDay()] + ',<br>' + M[d.getMonth()];
    })();
  </script>
</body>
</html>
