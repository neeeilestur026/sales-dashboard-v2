<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item Labels</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/labels.css">
</head>
<body class="lb">
  <script src="js/theme.js"></script>
  <header class="navbar" id="navbar"></header>

  <!-- A316: our own QR label (HXI:<Item ID>) for items that arrive without a barcode. Sized for a
       50 x 30 mm thermal label; any printer works, one label per page. -->
  <main class="main-content lb-main">
    <header class="lb-top">
      <div>
        <h1>Item labels</h1>
        <p>Stick one on each box. The scanner reads it as that item, on any phone.</p>
      </div>
      <button type="button" class="btn btn-primary" id="lbPrint" disabled>Print labels</button>
    </header>
    <section class="hx-glass lb-controls" id="lbControls"><div class="hx-empty">Loading…</div></section>
    <section class="lb-sheet" id="lbSheet" aria-label="Labels to print"></section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/flow-api.js"></script>
  <script src="js/labels.js"></script>
</body>
</html>
