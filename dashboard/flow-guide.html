<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow — Process Guide</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/flow.css">
  <style>
    .fg-step { border: 1px solid var(--hx-hair); border-radius: 14px; padding:1rem 1.2rem; margin-bottom:0.85rem; background: var(--hx-card); }
    .fg-step h3 { margin:0 0 0.35rem; font-size:1rem; display:flex; align-items:center; gap:0.55rem; }
    .fg-num { display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius: 50%; background: var(--hx-navy); color: var(--hx-slab-ink); font-size:0.8rem; font-weight:700; flex:0 0 auto; }
    .fg-who { font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color: var(--hx-navy); background: var(--hx-navy-soft); padding:0.12rem 0.5rem; border-radius: 999px; }
    .fg-step p { margin:0.3rem 0; font-size:0.88rem; color: var(--hx-ink-2); line-height:1.55; }
    .fg-step ul { margin:0.35rem 0 0.2rem 1.1rem; font-size:0.85rem; color: var(--hx-ink-2); line-height:1.5; }
    .fg-gate { font-size:0.8rem; color: var(--hx-warn); background: var(--hx-warn-soft); border-left: 3px solid var(--hx-warn); padding:0.4rem 0.7rem; border-radius: 0 8px 8px 0; margin-top:0.5rem; }
    .fg-status { font-size:0.8rem; margin-top:0.4rem; }
    .fg-status code { background: var(--hx-inset); padding:0.1rem 0.4rem; border-radius: 5px; font-size:0.78rem; }
    .fg-sec { margin:1.6rem 0 0.7rem; font-size:0.78rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color: var(--hx-ink-3); }
  </style>
</head>
<body>
  <script src="js/theme.js"></script>
  <header class="navbar" id="navbar"></header>
  <main class="main-content">
    <div class="page-header">
      <h1>Process Guide</h1>
      <p>The end-to-end flow, who does each step, what each status means, and the checks that keep money correct. The single source of truth for the procure-to-cash process.</p>
    </div>
    <div class="flow-nav" id="flowNav"></div>
    <div id="fgBody"></div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/flow-api.js"></script>
  <script src="js/flow-guide.js"></script>
</body>
</html>
