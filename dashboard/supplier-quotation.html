<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Supplier Quotation</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .sq-form { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1.25rem; }
    .sq-form .full { grid-column: 1 / -1; }
    .sq-form label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.25rem; }
    .sq-form input, .sq-form select, .sq-form textarea {
      width: 100%; padding: 0.5rem 0.7rem; background: var(--surface-2);
      border: 1px solid var(--border); border-radius: 8px;
      color: var(--text-primary); font-size: 0.875rem; font-family: inherit;
    }
    .sq-form textarea { resize: vertical; min-height: 60px; }
    .sq-form input:focus, .sq-form select:focus, .sq-form textarea:focus { outline: none; border-color: var(--accent); }
    .sq-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .sq-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; table-layout: fixed; }
    .sq-table th { text-align: left; padding: 0.6rem 0.75rem; color: var(--text-muted); border-bottom: 1px solid var(--border); font-weight: 600; white-space: nowrap; }
    .sq-table td { padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--hx-hair-2); color: var(--text-primary); vertical-align: top; word-wrap: break-word; overflow-wrap: break-word; white-space: normal; }
    .sq-table tr:hover td { background: var(--hx-hair-2); }
    .search-bar { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; margin-bottom: 1.25rem; }
    .search-bar input { flex: 1; min-width: 200px; padding: 0.5rem 0.75rem; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-size: 0.875rem; }
    .search-bar input::placeholder { color: var(--text-muted); }
    .count-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.75rem; }
    .toggle-form-btn { cursor: pointer; }
    .form-section { display: none; }
    .form-section.open { display: block; }
    @media(max-width: 640px) { .sq-form { grid-template-columns: 1fr; } }

    /* Line items table */
    .line-items-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-bottom: 0.75rem; }
    .line-items-table th { text-align: left; padding: 0.45rem 0.5rem; color: var(--text-muted); border-bottom: 1px solid var(--border); font-weight: 600; font-size: 0.75rem; }
    .line-items-table td { padding: 0.35rem 0.5rem; border-bottom: 1px solid var(--hx-hair-2); vertical-align: top; }
    .line-items-table input, .line-items-table textarea {
      width: 100%; padding: 0.35rem 0.5rem; background: var(--surface-2);
      border: 1px solid var(--border); border-radius: 6px;
      color: var(--text-primary); font-size: 0.82rem; font-family: inherit;
    }
    .line-items-table textarea { resize: vertical; min-height: 40px; }
    .line-items-table input:focus, .line-items-table textarea:focus { outline: none; border-color: var(--hx-warn); }
    .line-items-table .pr-ref { font-size: 0.72rem; color: var(--hx-cyan-ink); background: var(--hx-cyan-soft); padding: 0.2rem 0.35rem; border-radius: 4px; margin-top: 0.2rem; display: block; }
    .grand-total { font-weight: 700; color: var(--accent); font-size: 1rem; text-align: right; padding: 0.5rem 0; }
    .btn-add-item { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.35rem 0.7rem; background: var(--hx-ok-soft); color: var(--hx-ok); border: 1px solid var(--hx-ok-soft); border-radius: 6px; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
    .btn-add-item:hover { background: var(--hx-ok-soft); }
    .btn-remove-item { padding: 0.2rem 0.4rem; background: var(--hx-red-soft); color: var(--hx-red); border: 1px solid var(--hx-red-soft); border-radius: 4px; cursor: pointer; font-size: 0.72rem; }

    /* File upload */
    .file-upload-area { border: 2px dashed var(--border); border-radius: 8px; padding: 1rem; text-align: center; margin-bottom: 0.75rem; cursor: pointer; transition: border-color 0.15s; }
    .file-upload-area:hover { border-color: var(--hx-warn); }
    .file-upload-area.dragover { border-color: var(--hx-warn); background: var(--hx-warn-soft); }
    .file-list { list-style: none; padding: 0; margin: 0; }
    .file-list li { display: flex; align-items: center; justify-content: space-between; padding: 0.35rem 0.5rem; background: var(--surface-2); border-radius: 6px; margin-bottom: 0.35rem; font-size: 0.82rem; }
    .file-list li .file-name { color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 300px; }
    .file-list li .file-size { color: var(--text-muted); font-size: 0.72rem; margin-left: 0.5rem; }
    .progress-bar { width: 100%; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-top: 0.5rem; }
    .progress-bar .fill { height: 100%; background: var(--hx-warn); transition: width 0.3s; }
  </style>
</head>
<body>
  <script src="js/theme.js"></script>
  <header class="navbar" id="navbar"></header>

  <main class="main-content">
    <div class="page-header">
      <h1>Supplier Quotation</h1>
      <p>Record quotations received from suppliers.</p>
    </div>

    <!-- Add New Form (collapsible) -->
    <div class="chart-card" style="margin-bottom:1.5rem;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem;">
        <h3 style="font-size:0.95rem;font-weight:600;color: var(--text-primary);display:flex;align-items:center;gap:0.4rem;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Supplier Quotation
        </h3>
        <button class="btn btn-sm btn-secondary toggle-form-btn" onclick="toggleForm()">
          <span id="toggleLabel">Show Form</span>
        </button>
      </div>

      <div id="formSection" class="form-section">
        <div id="prLinkBanner" style="display:none; padding:0.75rem 1rem; background: var(--hx-cyan-soft); border: 1px solid var(--hx-cyan-soft); border-radius: 8px; margin-bottom:0.75rem; font-size:0.85rem;">
          <strong style="color: var(--hx-cyan-ink);">Linked to PR:</strong>
          <span id="prLinkInfo" style="color: var(--text-primary);"></span>
          <div id="prLinkItems" style="margin-top:0.35rem;font-size:0.78rem;color: var(--text-secondary);"></div>
        </div>
        <form id="sqForm" onsubmit="submitQuotation(event)">
          <input type="hidden" id="sqPRNumber" value="">
          <input type="hidden" id="sqPRAgentName" value="">
          <div class="sq-form">
            <div>
              <label for="sqDate">Date</label>
              <input type="date" id="sqDate" required>
            </div>
            <div>
              <label for="sqRefNo">Reference No.</label>
              <input type="text" id="sqRefNo" placeholder="e.g. SQ-2026-001">
            </div>
            <div class="full">
              <label for="sqSupplier">Supplier Company Name <span style="color: var(--hx-red);">*</span></label>
              <input type="text" id="sqSupplier" placeholder="e.g. Hydraulic Technologies" required>
            </div>
            <div>
              <label for="sqContact">Contact Person</label>
              <input type="text" id="sqContact" placeholder="Full name">
            </div>
            <div>
              <label for="sqPhone">Contact #</label>
              <input type="text" id="sqPhone" placeholder="Phone number">
            </div>
            <div class="full">
              <label for="sqEmail">Email</label>
              <input type="email" id="sqEmail" placeholder="email@supplier.com">
            </div>
            <div>
              <label for="sqCurrency">Currency</label>
              <select id="sqCurrency">
                <option value="PHP">PHP</option>
                <option value="USD">USD</option>
                <option value="SGD">SGD</option>
                <option value="EUR">EUR</option>
                <option value="AUD">AUD</option>
              </select>
            </div>
            <div>
              <label for="sqRemarks">Remarks</label>
              <input type="text" id="sqRemarks" placeholder="Any additional notes...">
            </div>
          </div>

          <!-- Line Items Table -->
          <div class="full" style="margin-bottom:0.75rem;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
              <label style="font-size:0.85rem;font-weight:600;color: var(--text-primary);margin:0;">Line Items</label>
              <button type="button" class="btn-add-item" onclick="addLineItem()">+ Add Item</button>
            </div>
            <div style="overflow-x:auto;">
              <table class="line-items-table">
                <thead>
                  <tr>
                    <th style="width:30px;">#</th>
                    <th style="min-width:200px;">Supplier Item Description <span style="color: var(--hx-red);">*</span></th>
                    <th style="width:60px;">Qty</th>
                    <th style="width:100px;">Price/Unit</th>
                    <th style="width:100px;">Total</th>
                    <th style="width:30px;"></th>
                  </tr>
                </thead>
                <tbody id="lineItemsBody"></tbody>
              </table>
            </div>
            <div class="grand-total" id="grandTotal">Grand Total: 0.00</div>
          </div>

          <!-- File Upload -->
          <div class="full" style="margin-bottom:1rem;">
            <label style="font-size:0.85rem;font-weight:600;color: var(--text-primary);margin-bottom:0.5rem;display:block;">Supporting Documents (optional)</label>
            <div class="file-upload-area" id="fileDropArea" onclick="document.getElementById('fileInput').click()">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:0.35rem;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <div style="font-size:0.82rem;color: var(--text-muted);">Click or drag files here (PDF, images, docs)</div>
              <input type="file" id="fileInput" multiple accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx" style="display:none;" onchange="handleFileSelect(this.files)">
            </div>
            <ul class="file-list" id="fileList"></ul>
          </div>

          <div id="uploadProgress" style="display:none;margin-bottom:0.75rem;">
            <div style="font-size:0.82rem;color: var(--text-muted);" id="uploadStatus">Uploading...</div>
            <div class="progress-bar"><div class="fill" id="uploadFill" style="width:0%;"></div></div>
          </div>

          <div class="sq-actions">
            <button type="submit" class="btn btn-primary" id="submitBtn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              Submit to Sheet
            </button>
            <button type="button" class="btn btn-secondary" onclick="resetForm()">Clear</button>
          </div>
        </form>
        <div id="formMsg" style="display:none;padding:0.5rem;border-radius: 8px;font-size:0.85rem;margin-top:0.5rem;"></div>
      </div>
    </div>

    <!-- Records List -->
    <div class="chart-card">
      <h3 style="font-size:0.95rem;font-weight:600;color: var(--text-primary);margin-bottom:0.75rem;">Saved Quotations</h3>
      <div class="search-bar">
        <input type="text" id="sqSearch" placeholder="Search supplier..." oninput="loadRecords()">
        <button class="btn btn-sm btn-secondary" onclick="loadRecords()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          Refresh
        </button>
      </div>
      <div id="sqCount" class="count-label"></div>
      <div id="sqContainer" style="overflow-x:auto;">
        <div class="loading-overlay"><div class="spinner spinner-lg"></div><span>Loading...</span></div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/supplier-quotation-inline.js"></script>
</body>
</html>
