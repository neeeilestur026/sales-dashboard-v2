<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Orders — Overview</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .mso-toolbar {
      display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center;
      margin-bottom:1rem;
    }
    .mso-toolbar input, .mso-toolbar select {
      padding:0.5rem 0.65rem; border: 1px solid var(--hx-hair); border-radius: 8px;
      background: var(--hx-inset); color: var(--hx-ink); font-size:0.85rem;
    }
    .mso-search { flex:1; min-width:220px; }
    .mso-tab {
      padding:0.4rem 0.85rem; border-radius: 8px; border: 1px solid var(--hx-hair);
      background: transparent; color: var(--hx-ink-3); font-size:0.8rem; cursor:pointer; font-weight:600;
    }
    .mso-tab.active { background: var(--hx-navy); border-color: var(--hx-navy); color: var(--hx-slab-ink); }
    .mso-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:0.75rem; margin-bottom:1rem; }
    .mso-kpi {
      background: var(--hx-inset); border: 1px solid var(--hx-hair); border-radius: 12px;
      padding:0.85rem 1rem;
    }
    .mso-kpi .lbl { font-size:0.72rem; color: var(--hx-ink-3); text-transform:uppercase; letter-spacing:0.04em; }
    .mso-kpi .val { font-size:1.5rem; font-weight:700; margin-top:0.15rem; color: var(--hx-ink); }
    .mso-card { background: var(--hx-inset); border: 1px solid var(--hx-hair); border-radius: 12px; overflow:hidden; }
    .mso-table-wrap { overflow-x:auto; }
    .mso-table { width:100%; border-collapse: collapse; font-size:0.85rem; min-width:980px; table-layout:fixed; }
    .mso-table th {
      text-align:left; padding:0.55rem 0.6rem; color: var(--hx-ink-3);
      border-bottom: 1px solid var(--hx-hair); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.04em;
      background:var(--hx-scrim);
    }
    .mso-table td { padding:0.55rem 0.6rem; border-bottom: 1px solid var(--hx-inset); color: var(--hx-ink); }
    .mso-table td.nowrap { white-space:nowrap; }
    .mso-table td.wrap { word-break:break-word; overflow-wrap:anywhere; }
    .mso-table tr.main-row { cursor:pointer; }
    .mso-table tr.main-row:hover td { background: var(--hx-cyan-soft); }
    .mso-table tr.items-row td { padding:0; background: var(--hx-cyan-soft); }
    .mso-table tr.items-row.hidden { display:none; }
    .mso-inner { padding:0.7rem 1rem 0.85rem 2rem; }
    .mso-items { width:100%; border-collapse: collapse; font-size:0.8rem; }
    .mso-items th { text-align:left; padding:0.35rem 0.5rem; color: var(--hx-ink-3); font-size:0.68rem; text-transform:uppercase; }
    .mso-items td { padding:0.35rem 0.5rem; color: var(--hx-ink); border-top: 1px solid var(--hx-inset); }
    .badge { display:inline-block; padding:0.2rem 0.55rem; border-radius: 999px; font-size:0.72rem; font-weight:600; }
    .badge-pending   { background: var(--hx-warn-soft);  color: var(--hx-warn); }
    .badge-delivered { background: var(--hx-ok-soft);  color: var(--hx-ok); }
    .badge-cancelled { background: var(--hx-red-soft);  color: var(--hx-red); }
    .mso-count { font-size:0.8rem; color: var(--hx-ink-3); margin-bottom:0.5rem; }
    .mso-chevron { display:inline-block; transition:transform 0.15s; color: var(--hx-ink-3); }
    .mso-chevron.open { transform:rotate(90deg); }
  </style>
</head>
<body>
  <script src="js/theme.js"></script>
  <header class="navbar" id="navbar"></header>

  <main class="main-content">
    <div style="max-width:1400px;margin:0 auto;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:0.5rem;margin-bottom:1rem;">
        <div>
          <h1 style="margin:0;">Sales Orders</h1>
          <p style="margin:0.25rem 0 0;color: var(--hx-ink-3);font-size:0.85rem;">
            Full sales order history with monthly and yearly filters.
          </p>
        </div>
        <button class="btn" onclick="loadSalesOrders()">Refresh</button>
      </div>

      <div class="mso-kpis" id="msoKpis">
        <div class="mso-kpi"><div class="lbl">Total Orders</div><div class="val" id="kpiTotal">—</div></div>
        <div class="mso-kpi"><div class="lbl">Pending</div><div class="val" id="kpiPending" style="color: var(--hx-warn);">—</div></div>
        <div class="mso-kpi"><div class="lbl">Delivered</div><div class="val" id="kpiDelivered" style="color: var(--hx-ok);">—</div></div>
        <div class="mso-kpi"><div class="lbl">Total Amount</div><div class="val" id="kpiAmount" style="color: var(--hx-cyan-ink);">—</div></div>
      </div>

      <div class="mso-toolbar">
        <input type="text" id="msoSearch" class="mso-search" placeholder="Search SO No, customer, invoice…" oninput="applyFilters()">
        <label style="font-size:0.78rem;color: var(--hx-ink-3);">Month</label>
        <input type="month" id="msoMonth" onchange="applyFilters()">
        <label style="font-size:0.78rem;color: var(--hx-ink-3);">Year</label>
        <select id="msoYear" onchange="applyFilters()"><option value="">All</option></select>
        <button class="mso-tab" onclick="setStatus('all')" id="tabAll">All</button>
        <button class="mso-tab" onclick="setStatus('Pending')" id="tabPending">Pending</button>
        <button class="mso-tab" onclick="setStatus('Delivered')" id="tabDelivered">Delivered</button>
        <button class="mso-tab" onclick="clearAllFilters()">Clear</button>
      </div>

      <div class="mso-count" id="msoCount"></div>

      <div class="mso-card">
        <div class="mso-table-wrap">
        <table class="mso-table" id="msoTable">
          <colgroup>
            <col style="width:34px;">
            <col style="width:120px;">
            <col style="width:100px;">
            <col>
            <col style="width:110px;">
            <col style="width:130px;">
            <col style="width:150px;">
          </colgroup>
          <thead>
            <tr>
              <th></th>
              <th>SO No</th>
              <th>Date</th>
              <th>Customer</th>
              <th>Status</th>
              <th>Invoice #</th>
              <th style="text-align:right;">Amount</th>
            </tr>
          </thead>
          <tbody id="msoBody">
            <tr><td colspan="7" style="text-align:center;color: var(--hx-ink-3);padding:1.5rem;">Loading…</td></tr>
          </tbody>
        </table>
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/flow-api.js"></script>
  <script src="js/management-sales-orders-inline.js"></script>
</body>
</html>
