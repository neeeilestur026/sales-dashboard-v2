<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales plan</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/flow.css">
  <link rel="stylesheet" href="css/flow-screen.css">
  <link rel="stylesheet" href="css/sales-plan.css">
  <link rel="stylesheet" href="css/ledger.css">
  <link rel="stylesheet" href="css/apple.css">
</head>
<body class="flow-screen">
  <script src="js/theme.js"></script>
  <header class="navbar" id="navbar"></header>
  <main class="main-content sp-main">
    <!-- A403 — the Sales plan (Neil, 23 Nov 2026): his Individual Sales Strategy Workbook in the portal — the year target and
         its months, the accounts, the sales log, the pipeline and the daily activity, filled in from what the portal already
         knows. A rep sees their own; the director and management see every rep and set the targets. js/sales-plan.js draws it
         from FlowAPI 202's getSalesPlan and getSalesActivity. -->
    <header class="sp-head">
      <div class="sp-titles">
        <h1 id="spTitle">Sales plan</h1>
        <p class="sp-lede" id="spLede">Your target, accounts, sales, pipeline and activity — filled in from the portal.</p>
        <p class="sp-sync" id="spSync" aria-live="polite"></p>
      </div>
      <div class="sp-controls" id="spControls"></div>
    </header>
    <section class="sp-team" id="spTeam" aria-label="The team" hidden></section>
    <div class="sp-tabs" id="spTabs" role="tablist" aria-label="The plan"></div>
    <div class="sp-body" id="spBody"></div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ledger-nav.js"></script>
  <script src="js/flow-api.js"></script>
  <script src="js/sales-plan-model.js"></script>
  <script src="js/sales-plan.js"></script>
</body>
</html>
