<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Report Summary</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Chart.js, jsPDF, XLSX loaded lazily via api.js -->
  <style>
    .toggle-bar {
      display: flex; gap: 0.5rem; margin-bottom: 1.25rem; flex-wrap: wrap; align-items: center;
    }
    .toggle-btn {
      padding: 0.45rem 1rem; border-radius: 8px; font-size: 0.82rem; font-weight: 600;
      cursor: pointer; border: 1px solid var(--border);
      background: transparent; color: var(--text-muted);
    }
    .toggle-btn.active {
      background: var(--accent); color: var(--hx-slab-ink); border-color: var(--accent);
    }
    .export-btns { margin-left: auto; display: flex; gap: 0.4rem; }
    .export-btn {
      padding: 0.35rem 0.7rem; border-radius: 6px; font-size: 0.75rem; font-weight: 600;
      cursor: pointer; border: 1px solid var(--border);
      background: var(--hx-inset); color: var(--text-secondary);
    }
    .export-btn:hover { background: var(--hx-inset); color: var(--text-primary); }
    .summary-table {
      width: 100%; border-collapse: collapse; font-size: 0.85rem;
    }
    .summary-table th {
      text-align: left; padding: 0.6rem 0.75rem;
      color: var(--text-muted); border-bottom: 1px solid var(--border);
      font-weight: 600; white-space: nowrap;
    }
    .summary-table td {
      padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--hx-hair-2);
      color: var(--text-primary);
    }
    .summary-table tr:hover td { background: var(--hx-hair-2); }
    .summary-table tfoot td {
      font-weight: 700; border-top: 2px solid var(--border);
      color: var(--accent);
    }
    .date-range-label { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 0.75rem; }
    .zero { color: var(--text-muted); }
    .chart-section { margin-top: 1.5rem; }
    .chart-section canvas { max-height: 300px; }
  </style>
</head>
<body>
  <script src="js/theme.js"></script>
  <header class="navbar" id="navbar"></header>

  <main class="main-content">
    <div class="page-header">
      <h1>Report Summary</h1>
      <p>Aggregated activity across all agents.</p>
    </div>

    <div class="chart-card">
      <div class="toggle-bar">
        <button class="toggle-btn active" id="btnWeek" onclick="loadSummary('week')">This Week</button>
        <button class="toggle-btn" id="btnMonth" onclick="loadSummary('month')">This Month</button>
        <div class="export-btns">
          <button class="export-btn" onclick="exportPDF()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            PDF
          </button>
          <button class="export-btn" onclick="exportExcel()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Excel
          </button>
        </div>
      </div>

      <div id="rangeLabel" class="date-range-label"></div>

      <div id="summaryContainer" style="overflow-x:auto;">
        <div class="loading-overlay"><div class="spinner spinner-lg"></div><span>Loading...</span></div>
      </div>

      <!-- Activity Breakdown Chart -->
      <div class="chart-section" id="chartSection" style="display:none;">
        <h3 style="font-size:0.9rem;font-weight:600;margin-bottom:0.75rem;color: var(--text-secondary);">Activity Breakdown by Agent</h3>
        <canvas id="summaryChart"></canvas>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin-summary-inline.js"></script>
</body>
</html>
