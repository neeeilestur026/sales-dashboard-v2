<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Book</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/flow.css">
  <link rel="stylesheet" href="css/flow-screen.css">
  <link rel="stylesheet" href="css/client-book.css">
  <link rel="stylesheet" href="css/ledger.css">
  <link rel="stylesheet" href="css/apple.css">
</head>
<body class="flow-screen">
  <script src="js/theme.js"></script>
  <header class="navbar" id="navbar"></header>
  <main class="main-content cb-main">
    <!-- A350 — the Client Book (Neil, 21 Oct 2026): clients with their contact people, accreditation and sales status,
         beside their purchase requests and quotations. The director sees every client, a sales rep their own (A358).
         A362 — laid out like Contacts on a Mac: a compact list on the left, the client on the right, each scrolling on
         its own so the page fits the screen; on a tablet or phone the client opens as a sheet. js/client-book.js draws it. -->
    <header class="cb-head">
      <div class="cb-titles">
        <h1 id="cbH1">Client Book</h1>
        <p class="cb-lede" id="cbLede">Clients with their people, accreditation and sales status, beside their purchase requests and quotations.</p>
      </div>
      <div class="cb-actions">
        <span class="cb-trial" id="cbTrial">Trial — each rep sees only their own clients</span>
        <button type="button" class="btn btn-secondary" id="cbExport">Export CSV</button>
        <button type="button" class="btn btn-primary" id="cbAdd">Add client</button>
      </div>
    </header>
    <div id="cbNotice"></div>
    <div class="cb-filters" id="cbFilters" role="search"></div>
    <div class="cb-chips" id="cbChips" role="group" aria-label="Show"></div>
    <div class="cb-split" id="cbSplit">
      <section class="cb-listcol" aria-label="Clients">
        <p class="cb-count" id="cbFoot" aria-live="polite"></p>
        <div class="cb-list" id="cbTable" role="list"></div>
      </section>
      <section class="cb-pane" id="cbPane" aria-label="The client"></section>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ledger-nav.js"></script>
  <script src="js/flow-api.js"></script>
  <script src="js/client-rollup.js"></script>
  <script src="js/client-book-model.js"></script>
  <script src="js/client-book.js"></script>
</body>
</html>
