<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Sales Targets</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .filter-bar {
      display: flex; gap: 0.75rem; align-items: center;
      margin-bottom: 1.25rem; flex-wrap: wrap;
    }
    .filter-bar label { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
    .filter-bar input[type="month"] {
      padding: 0.5rem 0.75rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px; color: var(--text-primary);
      font-size: 0.875rem;
    }
    .filter-bar input[type="month"]::-webkit-calendar-picker-indicator { filter: invert(0.7); cursor: pointer; }
    .targets-table {
      width: 100%; border-collapse: collapse; font-size: 0.875rem;
    }
    .targets-table th {
      text-align: left; padding: 0.65rem 0.9rem;
      color: var(--text-muted); border-bottom: 1px solid var(--border);
      font-weight: 600;
    }
    .targets-table td {
      padding: 0.5rem 0.9rem; border-bottom: 1px solid var(--hx-hair-2);
      color: var(--text-primary);
    }
    .targets-table input[type="number"] {
      width: 80px; padding: 0.35rem 0.5rem; text-align: center;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px; color: var(--text-primary);
      font-size: 0.85rem;
    }
    .save-btn {
      background: var(--hx-ok-soft); border: 1px solid var(--hx-ok-soft);
      color: var(--hx-ok); border-radius: 6px; padding: 0.3rem 0.7rem;
      font-size: 0.75rem; font-weight: 600; cursor: pointer;
    }
    .save-btn:hover { background: var(--hx-ok-soft); }
    .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status-msg { font-size: 0.75rem; margin-left: 0.5rem; }
    .status-msg.success { color: var(--hx-ok); }
    .status-msg.error { color: var(--hx-red); }
  </style>
</head>
<body>
  <script src="js/theme.js"></script>
  <header class="navbar" id="navbar"></header>

  <main class="main-content">
    <div class="page-header">
      <h1>Sales Targets</h1>
      <p>Set monthly targets for each sales agent.</p>
    </div>

    <div class="chart-card">
      <div class="filter-bar">
        <label>Month:</label>
        <input type="month" id="targetMonth" onchange="loadTargets()">
      </div>

      <div id="targetsContainer" style="overflow-x:auto;">
        <div class="loading-overlay"><div class="spinner spinner-lg"></div><span>Loading...</span></div>
      </div>
    </div>

    <!-- Multi-month Target Achievement Chart -->
    <div class="chart-card" style="margin-top:1.5rem; display:none;" id="historySection">
      <h3 style="font-size:0.95rem;font-weight:600;margin-bottom:0.75rem;">Target Achievement History (Last 6 Months)</h3>
      <div style="position:relative;min-height:250px;">
        <canvas id="historyChart"></canvas>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin-targets-inline.js"></script>
</body>
</html>
