<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hi-Escorp Portal — Change Password</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <script src="js/theme.js"></script>
  <header class="navbar" id="navbar"></header>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1>Change password</h1>
        <p>Update your account password. You will be signed out once it changes.</p>
      </div>
    </div>

    <div class="chart-card account-card">
      <div class="password-form">
        <div class="form-group">
          <label class="form-label" for="currentPass">Current password</label>
          <input type="password" id="currentPass" class="form-input" placeholder="Enter current password" autocomplete="current-password">
        </div>
        <div class="form-group">
          <label class="form-label" for="newPass">New password</label>
          <input type="password" id="newPass" class="form-input" placeholder="At least 6 characters" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label class="form-label" for="confirmPass">Confirm new password</label>
          <input type="password" id="confirmPass" class="form-input" placeholder="Re-enter new password" autocomplete="new-password">
        </div>
        <button type="button" class="btn btn-primary" id="changeBtn" onclick="changePassword()">Change password</button>
        <div id="formMsg" class="form-msg"></div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const session = requireAuth();
    if (session) {
      renderNavbar('change-password');
    }

    async function changePassword() {
      const msgEl = document.getElementById('formMsg');
      msgEl.textContent = '';
      msgEl.className = 'form-msg';

      const currentPass = document.getElementById('currentPass').value;
      const newPass = document.getElementById('newPass').value;
      const confirmPass = document.getElementById('confirmPass').value;

      if (!currentPass || !newPass || !confirmPass) {
        msgEl.textContent = 'Please fill in all fields.';
        msgEl.className = 'form-msg error';
        return;
      }

      if (newPass.length < 6) {
        msgEl.textContent = 'New password must be at least 6 characters.';
        msgEl.className = 'form-msg error';
        return;
      }

      if (newPass !== confirmPass) {
        msgEl.textContent = 'New passwords do not match.';
        msgEl.className = 'form-msg error';
        return;
      }

      const btn = document.getElementById('changeBtn');
      btn.disabled = true;
      btn.textContent = 'Changing...';

      try {
        const result = await apiChangePassword(session.username, currentPass, newPass);
        if (result.success) {
          msgEl.textContent = 'Password changed. You will be signed out.';
          msgEl.className = 'form-msg success';
          setTimeout(() => logout(), 2000);
        } else {
          msgEl.textContent = result.message || 'The password could not be changed.';
          msgEl.className = 'form-msg error';
          btn.disabled = false;
          btn.textContent = 'Change password';
        }
      } catch (err) {
        msgEl.textContent = 'Error: ' + err.message;
        msgEl.className = 'form-msg error';
        btn.disabled = false;
        btn.textContent = 'Change password';
      }
    }
  </script>
</body>
</html>
