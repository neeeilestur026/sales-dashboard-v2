<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly AP Aging — Hi-Escorp</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/flow.css">
  <style>
    /* Same report shell accounting-summary.html and balance-sheet.html use. */
    .report { max-width: 1180px; margin: 0 auto; }
    .report-sheet { background: var(--hx-card); border: 1px solid var(--hx-hair);
                    border-radius: var(--hx-r-md); padding: 1.4rem 1.6rem; }
    .report-head { display: flex; justify-content: space-between; align-items: flex-start;
                   gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .report-head h1 { margin: 0; font-size: 1.35rem; }
    .report-head .meta { color: var(--hx-ink-3); font-size: 0.8rem; margin-top: 0.25rem; }
    .report-controls { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
    .report-controls select { padding: 0.35rem 0.5rem; border: 1px solid var(--hx-hair);
                              border-radius: 8px; background: var(--hx-card); }

    .apm-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
                gap: 0.7rem; margin-bottom: 1.1rem; }
    .apm-kpi { border: 1px solid var(--hx-hair); border-radius: 12px; padding: 0.7rem 0.85rem;
               background: var(--hx-inset); }
    .apm-kpi .l { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em;
                  color: var(--hx-ink-3); }
    .apm-kpi .v { font-size: 1.12rem; font-weight: 700; margin-top: 0.2rem;
                  font-variant-numeric: tabular-nums; }
    .apm-kpi .d { font-size: 0.68rem; color: var(--hx-ink-3); margin-top: 0.15rem; }
    .apm-kpi.paid .v { color: var(--hx-ok); }
    .apm-kpi.open .v { color: var(--hx-warn); }

    .apm-sec { margin-top: 1.5rem; }
    .apm-sec-title { font-weight: 700; font-size: 0.95rem; display: flex; align-items: baseline;
                     gap: 0.5rem; margin-bottom: 0.15rem; }
    .apm-sec-sub { font-weight: 400; font-size: 0.74rem; color: var(--hx-ink-3); }
    .apm-note { font-size: 0.74rem; color: var(--hx-ink-3); margin: 0.3rem 0 0.6rem; }

    /* A supplier group: a summary row that opens to its payables. */
    details.apm-grp { border: 1px solid var(--hx-hair); border-radius: 10px;
                      margin-bottom: 0.45rem; background: var(--hx-card); }
    details.apm-grp > summary { list-style: none; cursor: pointer; padding: 0.55rem 0.75rem;
                                display: flex; align-items: center; gap: 0.6rem; }
    details.apm-grp > summary::-webkit-details-marker { display: none; }
    details.apm-grp > summary::before { content: '▸'; color: var(--hx-ink-3);
                                        transition: transform .12s; }
    details.apm-grp[open] > summary::before { transform: rotate(90deg); }
    .apm-grp .g-name { font-weight: 600; }
    .apm-grp .g-n { font-size: 0.72rem; color: var(--hx-ink-3); }
    .apm-grp .g-v { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
    .apm-grp-body { padding: 0 0.75rem 0.6rem; }

    /* An inferred date is never presented as a recorded one. */
    .apm-inferred { background: var(--hx-warn-soft); color: var(--hx-warn); border-radius: 5px;
                    padding: 0 0.3rem; font-size: 0.68rem; white-space: nowrap; }
    .apm-warn { background: var(--hx-red-soft); color: var(--hx-red); border-radius: 5px;
                padding: 0 0.3rem; font-size: 0.68rem; white-space: nowrap; }
    .apm-banner { border: 1px solid var(--hx-warn-soft); background: var(--hx-warn-soft); color: var(--hx-warn);
                  border-radius: 10px; padding: 0.6rem 0.8rem; font-size: 0.78rem;
                  margin-bottom: 0.9rem; }
    .apm-banner.bad { border-color: var(--hx-red-soft); background: var(--hx-red-soft); color: var(--hx-red); }
    .apm-muted { color: var(--hx-ink-3); }

    @media print {
      .navbar, .no-print { display: none !important; }
      body { background: var(--hx-card); }
      .main-content { padding: 0 !important; margin: 0 !important; }
      .report-sheet { border: none; box-shadow: none; }
      .apm-kpi, table, .apm-sec { break-inside: avoid; }
      /* Groups print open — a collapsed section on paper is just missing data. */
      details.apm-grp > summary { display: flex; }
      details.apm-grp .apm-grp-body { display: block !important; }
    }
  </style>
</head>
<body>
  <script src="js/theme.js"></script>
  <header class="navbar" id="navbar"></header>
  <main class="main-content">
    <div class="report">
      <div class="report-sheet">
        <div class="report-head">
          <div>
            <h1>Monthly AP Aging</h1>
            <div class="meta" id="apmMeta">—</div>
          </div>
          <div class="report-controls no-print">
            <label for="apmMonth" class="apm-muted" style="font-size:0.78rem;">Month</label>
            <select id="apmMonth"></select>
            <button class="btn btn-sm btn-secondary" id="apmRefresh">Refresh</button>
            <button class="btn btn-sm btn-primary" id="apmPrint">Print</button>
          </div>
        </div>
        <div id="apmBody"><div class="dr-empty">Loading…</div></div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/flow-api.js"></script>
  <script src="js/ap-monthly-model.js"></script>
  <script src="js/ap-aging-monthly.js"></script>
</body>
</html>
