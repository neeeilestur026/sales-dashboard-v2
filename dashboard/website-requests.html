<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Requests</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/flow.css">
  <link rel="stylesheet" href="css/flow-screen.css">
  <link rel="stylesheet" href="css/ledger.css">
</head>
<body class="flow-screen">
  <script src="js/theme.js"></script>
  <header class="navbar" id="navbar"></header>
  <main class="main-content">
    <div class="hband">
      <div class="left">
        <div class="dpill"><span class="d" id="hbDay">—</span><span class="m" id="hbMon">&nbsp;</span></div>
        <div><div class="eyebrow">Sales · From hiescorp.com</div><h1>Website requests</h1><p>Quote lists and messages sent from the company website. Make a pricing request from a quote, or close a request once you have replied.</p></div>
      </div>
      <div class="wr-bar"><button type="button" class="btn btn-secondary" id="wrCheck">Check the website now</button><button type="button" class="btn btn-secondary" id="wrRefresh">Refresh</button></div>
    </div>
    <p class="wr-health" id="wrHealth" role="status"></p>

    <!-- A338: every field below was typed by a visitor to the website; website-requests.js escapes all of it -->
    <section class="chart-card">
      <div class="fc-head"><h3>Requests</h3><span class="fc-meta" id="wrMeta"></span>
        <label class="wr-filter">Show <select id="wrFilter"><option value="New">New</option><option value="Converted">Made into pricing requests</option><option value="Closed">Closed</option><option value="Spam">Spam</option><option value="">All</option></select></label>
      </div>
      <div class="flow-msg" id="wrMsg"></div>
      <div class="wr-list" id="wrList"><div class="loading-overlay"><div class="spinner spinner-lg"></div><span>Loading...</span></div></div>
    </section>
    <datalist id="wrPeople"></datalist>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ledger-nav.js"></script>
  <script src="js/flow-api.js"></script>
  <script src="js/website-requests.js"></script>
  <script>hxDatePill('long');</script>
</body>
</html>
