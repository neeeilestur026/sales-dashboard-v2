<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shutdown calendar</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/flow.css">
  <link rel="stylesheet" href="css/flow-screen.css">
  <link rel="stylesheet" href="css/shutdown-calendar.css">
  <link rel="stylesheet" href="css/ledger.css">
  <link rel="stylesheet" href="css/apple.css">
</head>
<body class="flow-screen shd">
  <script src="js/theme.js"></script>
  <header class="navbar" id="navbar"></header>
  <main class="main-content shd-main">
    <!-- A391 — the shutdown calendar (Neil, 2 Nov 2026): when clients' plants stop for maintenance or a turnaround, so the
         reps prepare quotes, rentals and tools before they start. One shared calendar for sales, the director and
         management; only the rep who added an entry, the director and management change it. js/shutdown-calendar.js. -->
    <header class="shd-head">
      <div>
        <h1>Shutdown calendar</h1>
        <p class="shd-lede">When clients' plants stop for maintenance or a turnaround, so we can prepare the quotes, rentals and tools before they start.</p>
      </div>
      <button type="button" class="btn btn-primary primary" id="shdAdd">Add a shutdown</button>
    </header>
    <div id="shdNotice"></div>
    <div class="shd-tools">
      <div class="shd-seg" id="shdSeg" role="tablist" aria-label="View"></div>
      <div class="shd-step" id="shdStep">
        <button type="button" data-step="prev" aria-label="The month before">‹</button>
        <span class="shd-month-label" id="shdMonth" aria-live="polite"></span>
        <button type="button" data-step="next" aria-label="The month after">›</button>
        <button type="button" data-step="today">Today</button>
      </div>
      <label class="shd-search"><span class="shd-sr">Search the calendar</span><input type="search" id="shdQ" autocomplete="off" placeholder="Search: client, site, scope, rep"></label>
    </div>
    <div class="shd-chips-bar" id="shdChips" role="group" aria-label="Show"></div>
    <div id="shdBody"></div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ledger-nav.js"></script>
  <script src="js/flow-api.js"></script>
  <script src="js/shutdown-calendar-model.js"></script>
  <script src="js/shutdown-calendar.js"></script>
</body>
</html>
