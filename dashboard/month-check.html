<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Month check — Hi-Escorp</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/flow.css">
  <link rel="stylesheet" href="css/month-check.css">
  <link rel="stylesheet" href="css/ledger.css">
</head>
<body>
  <script src="js/theme.js"></script>
  <header class="navbar" id="navbar"></header>
  <main class="main-content">
    <div class="report">
      <div class="report-sheet">
        <div class="report-head">
          <div>
            <h1>Month check</h1>
            <div class="meta" id="mcMeta">—</div>
          </div>
          <div class="report-controls no-print">
            <label for="mcMonth" class="mc-label">Month</label>
            <select id="mcMonth"></select>
            <button class="btn btn-sm btn-secondary" id="mcRefresh">Refresh</button>
            <button class="btn btn-sm btn-primary primary" id="mcPrint">Print</button>
          </div>
        </div>
        <div id="mcBody"><div class="dr-empty">Loading…</div></div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ledger-nav.js"></script>
  <script src="js/flow-api.js"></script>
  <script src="js/month-check-model.js"></script>
  <script src="js/month-check.js"></script>
</body>
</html>
