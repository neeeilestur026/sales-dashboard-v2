<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/flow.css">
  <!-- A288 — the director's shared system, then the three reference pages' kit -->
  <link rel="stylesheet" href="css/director.css">
  <link rel="stylesheet" href="css/director-pages.css">
</head>
<body class="dh dh-emails">
  <script src="js/director-theme.js"></script>
  <header class="navbar" id="navbar"></header>

  <main class="main-content dh-main">
    <div class="dh-deck">
      <aside class="dh-rail" id="rail">
        <div class="dh-rail-date">
          <span class="dh-rail-kicker">Director</span>
          <button type="button" class="dh-theme" id="themeToggle" aria-pressed="false" aria-label="Dark theme">
            <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <span>Dark</span>
          </button>
        </div>
        <section class="dh-slab">
          <div class="cap"><span class="l">Mailbox</span><span class="tag">GoDaddy</span></div>
          <div class="v em-who"><span id="whoTag" style="display:none;"></span></div>
          <div class="sub">Inbox, sent and spam. Incoming mail is sorted by kind as it arrives.</div>
        </section>
      </aside>

      <div class="dh-col">
        <header class="dh-mast">
          <div>
            <h1>Email</h1>
            <p>Your mailbox as the business sees it: enquiries, orders, suppliers and finance, newest first.</p>
          </div>
        </header>

        <div id="setupBox" style="display:none;"></div>

        <div id="feedBox" style="display:none;">
          <section class="dh-glass">
            <div class="dx-tools">
              <div class="dx-seg" id="tabs" role="group" aria-label="Folder">
                <button type="button" class="dx-tab em-tab active" data-folder="inbox">Inbox<span class="cnt" id="cntInbox"></span></button>
                <button type="button" class="dx-tab em-tab" data-folder="sent">Sent<span class="cnt" id="cntSent"></span></button>
                <button type="button" class="dx-tab em-tab" data-folder="spam">Spam<span class="cnt" id="cntSpam"></span></button>
              </div>
              <input type="text" id="search" class="grow" placeholder="Search sender or subject" aria-label="Search messages">
              <select id="daysSel" title="How far back to read" aria-label="How far back to read">
                <option value="7">Last 7 days</option>
                <option value="14" selected>Last 14 days</option>
                <option value="30">Last 30 days</option>
              </select>
              <button type="button" class="dh-btn" id="refreshBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
                Refresh
              </button>
            </div>
            <div class="dx-count" id="metaLine"></div>
            <div class="em-cats" id="catFilter" style="display:none;"></div>
            <div id="listBox" class="dh-scroll"><div class="dr-empty">Loading…</div></div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/director-emails.js"></script>
</body>
</html>
