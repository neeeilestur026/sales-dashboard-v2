<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard -- Pricing Submissions</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .toolbar {
      display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem;
    }
    .toolbar input[type="text"] {
      padding: 0.45rem 0.75rem; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text-primary);
      font-size: 0.85rem; min-width: 200px; font-family: inherit;
    }
    .toolbar input:focus { outline: none; border-color: var(--accent); }
    .sub-count { font-size: 0.82rem; color: var(--text-secondary); }

    .sub-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.15rem; margin-bottom: 1rem;
      cursor: default;
    }
    .sub-header {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .sub-id { font-weight: 700; font-size: 0.92rem; color: var(--text-primary); }
    .sub-meta {
      display: flex; gap: 1rem; flex-wrap: wrap; font-size: 0.78rem; color: var(--text-secondary);
    }
    .sub-meta span { display: flex; align-items: center; gap: 0.3rem; }
    .badge-pending { background: var(--hx-warn-soft); color: var(--hx-warn); padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.72rem; font-weight: 600; }
    .badge-forwarded { background: var(--hx-cyan-soft); color: var(--hx-cyan-ink); padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.72rem; font-weight: 600; }
    .badge-priced { background: var(--hx-ok-soft); color: var(--hx-ok); padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.72rem; font-weight: 600; }
    .badge-applied { background: rgba(168,85,247,0.12); color: var(--hx-navy-text); padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.72rem; font-weight: 600; }
    .badge-sent { background: rgba(20,184,166,0.12); color: var(--hx-navy-text); padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.72rem; font-weight: 600; }

    .btn-apply {
      display: inline-flex; align-items: center; gap: 0.3rem;
      padding: 0.3rem 0.7rem; background: var(--hx-ok-soft); color: var(--hx-ok);
      border: 1px solid var(--hx-ok-soft); border-radius: 6px;
      font-size: 0.75rem; font-weight: 600; cursor: pointer;
    }
    .btn-apply:hover { background: var(--hx-ok-soft); }
    .btn-apply:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-forward-sales {
      display: inline-flex; align-items: center; gap: 0.3rem;
      padding: 0.3rem 0.7rem; background: rgba(20,184,166,0.12); color: var(--hx-navy-text);
      border: 1px solid rgba(20,184,166,0.25); border-radius: 6px;
      font-size: 0.75rem; font-weight: 600; cursor: pointer; margin-left: 0.5rem;
    }
    .btn-forward-sales:hover { background: rgba(20,184,166,0.2); }
    .btn-forward-sales:disabled { opacity: 0.5; cursor: not-allowed; }

    .items-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .items-table th {
      text-align: left; padding: 0.5rem 0.75rem; font-size: 0.72rem; font-weight: 600;
      text-transform: uppercase; color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }
    .items-table td {
      padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--hx-hair-2);
    }
    .items-table .td-num {
      text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .items-table tr:last-child td { border-bottom: none; }

    .no-results {
      text-align: center; padding: 3rem 1rem; color: var(--text-muted);
    }

    .loading-overlay {
      display: flex; align-items: center; justify-content: center; gap: 0.75rem;
      padding: 3rem 1rem; color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <script src="js/theme.js"></script>
  <header class="navbar" id="navbar"></header>

  <main class="main-content">
    <div class="page-header">
      <h1>Pricing Submissions</h1>
      <p>View pricing submitted by management. Shows model numbers, descriptions, and final prices.</p>
    </div>

    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Search submissions..." oninput="applyFilter()">
      <select id="statusFilter" onchange="applyFilter()" style="padding:0.45rem 0.75rem;border-radius: 8px;border: 1px solid var(--border);background: var(--surface);color: var(--text-primary);font-size:0.85rem;font-family:inherit;">
        <option value="">All Statuses</option>
        <option value="Pending">Pending</option>
        <option value="Forwarded">Forwarded</option>
        <option value="Priced">Priced</option>
        <option value="Applied">Applied</option>
        <option value="Sent to Sales">Sent to Sales</option>
      </select>
      <span class="sub-count" id="subCount"></span>
    </div>

    <div id="subsContainer">
      <div class="loading-overlay"><div class="spinner spinner-lg"></div><span>Loading...</span></div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pricing-submissions-inline.js"></script>
</body>
</html>
